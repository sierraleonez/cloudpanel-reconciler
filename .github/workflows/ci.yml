name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.22'
          cache: true

      - name: Verify formatting
        run: test -z "$(gofmt -l .)" || { gofmt -l .; exit 1; }

      - name: Vet
        run: go vet ./...

      - name: Test
        run: go test -race ./...

      # Static, so the prod box never needs a Go toolchain.
      - name: Build
        run: CGO_ENABLED=0 go build -trimpath -ldflags='-s -w' -o reconciler ./cmd/reconciler

      - uses: actions/upload-artifact@v4
        with:
          name: reconciler-linux-amd64
          path: reconciler
