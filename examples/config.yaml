# /etc/reconciler/config.yaml  (mode 0600, root:root)
#
# Lives on the prod box, NOT in the infra repo: it holds the bot token.

stateDir: /var/lib/reconciler
lockFile: /run/reconciler.lock

infra:
  path: /var/lib/reconciler/infra
  remote: git@github.com:almerandika/infra.git
  branch: main          # protect this branch; only your key may push
  sitesDir: sites
  sshKey: /root/.ssh/infra_readonly

cloudpanel:
  nginxSitesDir: /etc/nginx/sites-enabled
  certDir: /etc/nginx/ssl-certificates
  fpmPoolDirTemplate: /etc/php/%s/fpm/pool.d

  # Checked against the domain's A/AAAA records before any Let's Encrypt
  # call. Required: without it a 2-minute loop would burn the issuance rate
  # limit on any domain whose DNS is not pointed here yet.
  serverIPs:
    - 203.0.113.10
    - "2001:db8::10"

  certBackoff: 6h
  certWarnBefore: 336h    # 14 days

telegram:
  botToken: "123456:REPLACE_ME"
  chatID: "-1001234567890"

deploy:
  keepReleases: 5
  healthTimeout: 60s
  commandTimeout: 15m
